  if(k==='h'||k==='р'){playerStars=Math.max(0,playerStars-1);flashMessage('Звёзд: '+playerStars);}
  if(k==='j'||k==='о'){playerStars=Math.min(5,playerStars+1);flashMessage('Звёзд: '+playerStars);}
  if(k==='a'||k==='ф')DROPPED.push({type:'apple',rx:player.x,ry:player.y,dx:(Math.random()-0.5)*120,dy:60+Math.random()*40});
  if(k==='g'||k==='п')DROPPED.push({type:'grenade',rx:player.x,ry:player.y,dx:(Math.random()-0.5)*120,dy:60+Math.random()*40,armed:true});
});

// ---------- G2. ИКОНКИ ПРЕДМЕТОВ ----------
// drawItem(type, x, y, масштаб, now, opts, контекст) — одна функция для пола, HUD, витрины и превью.
// Базовый размер ~26 px при s=1.
function starPath(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.46:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();}
function drawItem(type,x,y,s=1,now=0,opts={},c=ctx){
  const it=ITEMS[type];if(!it)return;
  c.save();c.translate(x,y);c.scale(s,s);c.lineJoin='round';c.lineCap='round';
  if(type==='star'){
    starPath(c,0,0,13);c.fillStyle=it.color;c.fill();c.strokeStyle='#6b4a00';c.lineWidth=2;c.stroke();
    starPath(c,-1.5,-2,6.5);c.fillStyle='rgba(255,255,255,0.4)';c.fill();
  }else if(type==='money'){ // три кристалла
    for(const[sx,sy,h,rot]of[[-8,5,9,-0.7],[9,6,8,0.6],[0,1,14,-0.12]]){
      c.save();c.translate(sx,sy);c.rotate(rot);
      c.beginPath();c.moveTo(0,-h);c.lineTo(4.5,-h*0.3);c.lineTo(3.5,h*0.45);c.lineTo(-3.5,h*0.45);c.lineTo(-4.5,-h*0.3);c.closePath();
      c.fillStyle=it.color;c.fill();c.strokeStyle='#0f3554';c.lineWidth=1.5;c.stroke();
      c.beginPath();c.moveTo(0,-h);c.lineTo(-4.5,-h*0.3);c.lineTo(-3.5,h*0.45);c.lineTo(0,h*0.05);c.closePath();c.fillStyle='rgba(255,255,255,0.4)';c.fill();
      c.restore();
    }
  }else if(type==='apple'){
    c.fillStyle=it.color;c.strokeStyle='#2d5a1c';c.lineWidth=2;
    c.beginPath();c.moveTo(0,-6);c.bezierCurveTo(-4,-12,-14,-9,-13,1);c.bezierCurveTo(-12,9,-6,13,0,10);
    c.bezierCurveTo(6,13,12,9,13,1);c.bezierCurveTo(14,-9,4,-12,0,-6);c.closePath();c.fill();c.stroke();
    c.fillStyle='rgba(255,255,255,0.35)';c.beginPath();c.ellipse(-5,-2,3,5,0.4,0,TAU);c.fill();
    c.strokeStyle='#5a3a1e';c.lineWidth=2;line(c,0,-6,1,-13);
    c.fillStyle='#3f8f2a';c.strokeStyle='#1e4a12';c.lineWidth=1.2;c.beginPath();c.ellipse(5,-10,5,2.4,-0.5,0,TAU);c.fill();c.stroke();
  }else if(type==='grenade'){
    c.fillStyle='#3a3f45';c.strokeStyle='#0e1012';c.lineWidth=2;
    c.beginPath();c.arc(0,3,11,0,TAU);c.fill();c.stroke();
    c.strokeStyle='rgba(0,0,0,0.5)';c.lineWidth=1.2;                        // насечка
    line(c,-10.5,3,10.5,3);line(c,0,-8,0,14);line(c,-9,-3,9,-3);line(c,-9,9,9,9);line(c,-6,-6,-6,12);line(c,6,-6,6,12);
    c.fillStyle='rgba(255,255,255,0.12)';c.beginPath();c.ellipse(-4,-1,3.5,5,0.5,0,TAU);c.fill();
    c.fillStyle='#6b7178';c.strokeStyle='#0e1012';c.lineWidth=1.5;c.fillRect(-4,-12,8,5);c.strokeRect(-4,-12,8,5);
    c.strokeStyle='#c9b07a';c.lineWidth=2;c.beginPath();c.moveTo(0,-12);c.quadraticCurveTo(3,-18,9,-16);c.stroke();
    if(opts.armed){                                                         // горящий фитиль
      const f=0.7+0.3*Math.sin(now*0.03);
      c.globalCompositeOperation='lighter';
      const g=c.createRadialGradient(9,-16,0,9,-16,10*f);g.addColorStop(0,'rgba(255,200,80,0.9)');g.addColorStop(1,'rgba(255,120,0,0)');
      c.fillStyle=g;c.beginPath();c.arc(9,-16,10*f,0,TAU);c.fill();
      c.globalCompositeOperation='source-over';
      c.fillStyle='#fff3c0';c.beginPath();c.arc(9,-16,1.8,0,TAU);c.fill();
      c.fillStyle='#ffb040';for(let i=0;i<4;i++){const a=now*0.02+i*1.7,r=4+((now*0.05+i*7)%6);c.fillRect(9+Math.cos(a)*r,-16+Math.sin(a)*r,1.5,1.5);}
    }
  }else if(type.startsWith('key')){
    for(const[col,w]of[['#15151d',6],[it.color,3.2]]){                     // тёмная подложка, затем цвет
      c.strokeStyle=col;c.lineWidth=w;
      c.beginPath();c.arc(-8,0,5,0,TAU);c.stroke();
      line(c,-3,0,13,0);line(c,8,0,8,5);line(c,12,0,12,5);
    }
    c.strokeStyle='rgba(255,255,255,0.45)';c.lineWidth=1;c.beginPath();c.arc(-8,0,5,Math.PI*1.1,Math.PI*1.7);c.stroke();line(c,-2,-1,10,-1);
  }else if(type==='scroll'){
    c.fillStyle=it.color;c.strokeStyle='#5a4a2a';c.lineWidth=1.5;
    c.fillRect(-13,-6,26,12);c.strokeRect(-13,-6,26,12);
    c.strokeStyle='rgba(90,74,42,0.45)';c.lineWidth=1;line(c,-9,-2,-1,-2);line(c,-9,2,-3,2);
    c.fillStyle='#cdbb8a';c.strokeStyle='#5a4a2a';c.lineWidth=1.5;
    for(const ex of[-13,13]){c.beginPath();c.ellipse(ex,0,3.2,7.5,0,0,TAU);c.fill();c.stroke();}
    c.globalCompositeOperation='lighter';                                   // светящаяся руна
    const g=c.createRadialGradient(6,0,0,6,0,8);g.addColorStop(0,'rgba(120,120,255,0.6)');g.addColorStop(1,'rgba(120,120,255,0)');
    c.fillStyle=g;c.fillRect(-2,-8,16,16);
    c.globalCompositeOperation='source-over';
    c.strokeStyle=it.accent;c.lineWidth=1.4;c.beginPath();c.arc(6,0,2.8,0,TAU);c.stroke();c.beginPath();c.arc(6,0,0.8,0,TAU);c.stroke();
  }else if(type==='exitmark'){                                              // «карта с отметкой»
    c.fillStyle='#22242c';c.strokeStyle='#8a8a99';c.lineWidth=1.5;c.fillRect(-12,-12,24,24);c.strokeRect(-12,-12,24,24);
    c.strokeStyle='rgba(255,255,255,0.12)';c.lineWidth=1;for(let i=-6;i<=6;i+=6){line(c,i,-12,i,12);line(c,-12,i,12,i);}
    c.strokeStyle=it.color;c.setLineDash([2,2]);line(c,-3,3,7,-7);c.setLineDash([]);
    c.fillStyle='#fff';c.beginPath();c.arc(-3,3,1.8,0,TAU);c.fill();
    c.fillStyle=it.color;c.fillRect(4,-10,6,6);
  }
  c.restore();
}

// ---------- G3. ПРЕДМЕТ НА ПОЛУ: «сцена» в центре и брошенные вещи ----------
function drawPickup(type,sx,sy,now,alpha){
  const it=ITEMS[type];if(!it)return;
  const bob=Math.sin(now*0.003+sx*0.02)*2.5;
  ctx.save();ctx.globalAlpha=alpha;
  ctx.globalCompositeOperation='lighter';                                   // световая подставка в цвет предмета
  const g=ctx.createRadialGradient(sx,sy+4,2,sx,sy+4,40);g.addColorStop(0,hexA(it.color,0.28));g.addColorStop(1,hexA(it.color,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy+4,40,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(sx+2,sy+13,12-bob*0.6,4,0,0,TAU);ctx.fill();
  drawItem(type,sx,sy-bob,1,now);
  ctx.restore();
}
function drawDroppedItem(d,sx,sy,now,alpha){                                // лежит на полу: без парения и подставки
  ctx.save();ctx.globalAlpha=alpha;
  ctx.fillStyle='rgba(0,0,0,0.35)';ctx.beginPath();ctx.ellipse(sx+2,sy+8,11,4,0,0,TAU);ctx.fill();
  drawItem(d.type,sx,sy,0.85,now,{armed:d.armed});
  ctx.restore();
}

// ---------- G4. ЗНАЧКИ КАРТЫ И ДЕМО-МИНИКАРТА ----------
function drawMapIcon(kind,x,y,sz=10,now=0){
  const it=ITEMS[kind],col=it?it.color:(MAP_COLORS[kind]||'#fff'),shape=it?it.map:kind;
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.lineCap='round';
  switch(shape){
    case 'star':starPath(ctx,0,0,sz*0.55);ctx.fill();break;
    case 'dot':ctx.beginPath();ctx.arc(0,0,sz*0.28,0,TAU);ctx.fill();break;
    case 'key':ctx.beginPath();ctx.arc(-sz*0.25,0,sz*0.18,0,TAU);ctx.stroke();line(ctx,-sz*0.05,0,sz*0.45,0);line(ctx,sz*0.3,0,sz*0.3,sz*0.2);break;
    case 'rect':ctx.fillRect(-sz*0.4,-sz*0.2,sz*0.8,sz*0.4);break;
    case 'square':ctx.fillRect(-sz*0.3,-sz*0.3,sz*0.6,sz*0.6);break;
    case 'exit':ctx.fillRect(-sz*0.4,-sz*0.4,sz*0.8,sz*0.8);break;
    case 'shop':ctx.strokeRect(-sz*0.4,-sz*0.4,sz*0.8,sz*0.8);ctx.beginPath();ctx.arc(0,0,sz*0.13,0,TAU);ctx.fill();break;
    case 'anomaly':ctx.beginPath();ctx.moveTo(-sz*0.3,-sz*0.45);ctx.lineTo(sz*0.1,-sz*0.05);ctx.lineTo(-sz*0.1,sz*0.05);ctx.lineTo(sz*0.3,sz*0.45);ctx.stroke();break;
    case 'monster':ctx.beginPath();ctx.arc(0,0,sz*0.26,0,TAU);ctx.fill();break;
    case 'player':{const p=0.75+0.25*Math.sin(now*0.006);ctx.beginPath();ctx.arc(0,0,sz*0.3*p,0,TAU);ctx.fill();ctx.globalAlpha=0.35;ctx.beginPath();ctx.arc(0,0,sz*0.5,0,TAU);ctx.fill();break;}
  }
  ctx.restore();
}
function drawMiniMap(now){
  const cell=16,pad=10,ox=CANVAS_SIZE-pad-MAP.w*cell,oy=pad;
  ctx.save();
  ctx.fillStyle='rgba(10,10,16,0.85)';ctx.fillRect(ox-5,oy-5,MAP.w*cell+10,MAP.h*cell+10);
  ctx.strokeStyle='#3a3a44';ctx.lineWidth=1;ctx.strokeRect(ox-5,oy-5,MAP.w*cell+10,MAP.h*cell+10);
  for(let y=0;y<MAP.h;y++)for(let x=0;x<MAP.w;x++){
    const cx=ox+x*cell+cell/2,cy=oy+y*cell+cell/2;
    ctx.fillStyle='#1e1e26';ctx.fillRect(ox+x*cell+1,oy+y*cell+1,cell-2,cell-2);
    const k=roomKind(x,y);if(k)drawMapIcon(k,cx,cy,13,now);
    const it=PICKUPS.get(x+','+y);if(it)drawMapIcon(it,cx,cy,11,now);
  }
  for(const m of monsters)drawMapIcon('monster',ox+m.room.x*cell+cell/2,oy+m.room.y*cell+cell/2,11,now);
  drawMapIcon('player',ox+player.x*cell+cell/2,oy+player.y*cell+cell/2,13,now);
  ctx.restore();
}

// ---------- G5. HUD (демо; в игре у вас HTML-строка — иконки те же через drawItem) ----------

// ---------- G6. ИГРОК: «уголёк» без защиты, цветные замки ----------
// Переопределяют одноимённые функции блока B (позднее объявление побеждает).
function torchPos(now){
  const cx=CANVAS_SIZE/2,cy=CANVAS_SIZE/2;
  let fl=0.9+0.1*Math.sin(now*0.02)+0.06*Math.sin(now*0.047);
  if(playerStars<=0)fl*=0.55+0.1*Math.sin(now*0.05);
  if(PLAYER_STYLE!=='figure')return{x:cx,y:cy,fl};
  const hand=facing==='W'?-1:1;
  return{x:cx+hand*13*PLAYER_SCALE,y:cy-6*PLAYER_SCALE,fl};
}
function drawPlayerOrb(now){
  const cx=CANVAS_SIZE/2,cy=CANVAS_SIZE/2,{fl}=torchPos(now);
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.ellipse(cx+2,cy+5,10,5,0,0,TAU);ctx.fill();
  ctx.globalCompositeOperation='lighter';
  if(playerStars>0){
    const g=ctx.createRadialGradient(cx,cy,2,cx,cy,26*fl);
    g.addColorStop(0,'rgba(255,230,170,0.9)');g.addColorStop(0.5,'rgba(255,180,80,0.35)');g.addColorStop(1,'rgba(255,140,40,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,26*fl,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#fff6d8';ctx.beginPath();ctx.arc(cx,cy,6,0,TAU);ctx.fill();
  }else{                                                                    // уголёк: тускло, без кольца
    const g=ctx.createRadialGradient(cx,cy,1,cx,cy,14*fl);
    g.addColorStop(0,'rgba(255,120,60,0.7)');g.addColorStop(1,'rgba(200,60,20,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,14*fl,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#ff8a5a';ctx.beginPath();ctx.arc(cx,cy,4,0,TAU);ctx.fill();
    ctx.fillStyle='#ffd0b0';ctx.beginPath();ctx.arc(cx-1,cy-1,1.5,0,TAU);ctx.fill();
  }
  ctx.restore();
}
function drawPlayerLight(now){
  const{x,y,fl}=torchPos(now),alive=playerStars>0;
  ctx.save();ctx.globalCompositeOperation='lighter';
  const R=230*fl*(alive?1:0.55);
  const g=ctx.createRadialGradient(x,y,10,x,y,R);
  g.addColorStop(0,`rgba(255,220,160,${LIGHT.playerA*(alive?1:0.3)})`);g.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=g;ctx.fillRect(x-R,y-R,R*2,R*2);ctx.restore();
}
function drawPadlock(x,y,color='#c0392b'){

  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.arc(0,1.5,1.5,0,TAU);ctx.fill();

// ---------- G7. МАГАЗИН ----------
let shopOverlay=null;
const SHOP_LAMPS=[[92,273],[308,273]];
function getShopOverlay(){
  if(shopOverlay)return shopOverlay;
  const off=document.createElement('canvas');off.width=off.height=S;const c=off.getContext('2d');
  c.lineJoin='round';c.lineCap='round';
  // ковёр
  const rx=80,ry=115,rw=240,rh=170;
  c.fillStyle='rgba(0,0,0,0.3)';c.fillRect(rx+3,ry+4,rw,rh);

  c.strokeStyle='#c9a24e';c.lineWidth=3;c.strokeRect(rx+7,ry+7,rw-14,rh-14);
  c.lineWidth=1;c.strokeRect(rx+13,ry+13,rw-26,rh-26);
  c.fillStyle='rgba(201,162,78,0.35)';
  for(let x=rx+26;x<rx+rw-14;x+=24)for(const y of[ry+20,ry+rh-20]){c.beginPath();c.moveTo(x,y-5);c.lineTo(x+5,y);c.lineTo(x,y+5);c.lineTo(x-5,y);c.closePath();c.fill();}
  // прилавок
  const px=100,py=135,pw=200,ph=26;

  c.strokeStyle='rgba(0,0,0,0.3)';c.lineWidth=1;for(let i=1;i<3;i++)line(c,px,py+ph*i/3,px+pw,py+ph*i/3);
  c.strokeStyle='rgba(255,220,160,0.2)';line(c,px,py+1,px+pw,py+1);
  // товар
  ['star','apple','grenade','key1','scroll','exitmark'].forEach((g,i)=>drawItem(g,px+20+i*32,py+ph/2,0.6,0,{},c));
  // торговец (спиной к северной стене): мантия, капюшон, руки на прилавке
  const mx=200,my=106;
  c.fillStyle='rgba(0,0,0,0.4)';c.beginPath();c.ellipse(mx+3,my+4,20,15,0,0,TAU);c.fill();
  c.fillStyle='#3a2a4a';c.strokeStyle='#120c18';c.lineWidth=2;c.beginPath();c.ellipse(mx,my,20,15,0,0,TAU);c.fill();c.stroke();
  c.fillStyle='#4a3a5e';c.beginPath();c.arc(mx,my+2,10,0,TAU);c.fill();c.stroke();
  c.fillStyle='#1a1020';c.beginPath();c.ellipse(mx,my+7,6,3.5,0,0,TAU);c.fill();
  c.fillStyle='#d9b892';c.strokeStyle='#5a3a1e';c.lineWidth=1.2;
  for(const s of[-1,1]){c.beginPath();c.ellipse(mx+s*14,py+7,5,3.5,0,0,TAU);c.fill();c.stroke();}
  // сундук справа от торговца
  c.fillStyle='rgba(0,0,0,0.4)';c.fillRect(px+pw-30+3,my-12+4,30,24);
  c.fillStyle='#5a3a1e';c.strokeStyle='#2a1a0c';c.lineWidth=2;c.fillRect(px+pw-30,my-12,30,24);c.strokeRect(px+pw-30,my-12,30,24);
  c.fillStyle='#8a9496';c.fillRect(px+pw-30,my-2,30,4);c.fillRect(px+pw-17,my-12,4,24);
  drawItem('money',px+pw-14,my+2,0.45,0,{},c);
  // выручка на прилавке и вывеска-табличка перед ковром
  drawItem('money',px+pw-12,py+ph+16,0.5,0,{},c);
  c.fillStyle='#4a3218';c.strokeStyle='#1a0e06';c.lineWidth=1.5;c.fillRect(160,ry+rh+10,80,20);c.strokeRect(160,ry+rh+10,80,20);
  drawItem('money',180,ry+rh+20,0.45,0,{},c);drawItem('star',222,ry+rh+20,0.5,0,{},c);
  c.strokeStyle='#c9a24e';c.lineWidth=1.5;line(c,198,ry+rh+13,204,ry+rh+27);

}
function drawShopRoom(r,now){

// ---------- G8. АНОМАЛИЯ ----------
let anomalyOverlay=null;
const ANOM_NODES=[[110,110],[290,110],[110,290],[290,290],[200,200]];   // 4 громоотвода + центральный диск
function getAnomalyOverlay(){
  if(anomalyOverlay)return anomalyOverlay;
  const off=document.createElement('canvas');off.width=off.height=S;const c=off.getContext('2d');
  const rng=mulberry32(0x0A0BADF0);
  for(let i=0;i<16;i++){                                                    // выжженные пятна
    const x=rng()*S,y=rng()*S,rad=25+rng()*60;
    const g=c.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,'rgba(0,0,0,0.5)');g.addColorStop(1,'rgba(0,0,0,0)');
    c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);
  }
  c.strokeStyle='rgba(0,0,0,0.5)';c.lineWidth=6;c.lineCap='round';           // канавки к громоотводам
  for(const[x,y]of ANOM_NODES.slice(0,4))line(c,200,200,x,y);
  c.fillStyle='#2a2d33';c.strokeStyle='#0d0f12';c.lineWidth=2;               // центральный диск
  c.beginPath();c.arc(200,200,44,0,TAU);c.fill();c.stroke();
  c.strokeStyle='#4a5058';c.lineWidth=1.5;c.beginPath();c.arc(200,200,32,0,TAU);c.stroke();
  for(let i=0;i<8;i++){const a=i/8*TAU;line(c,200+Math.cos(a)*12,200+Math.sin(a)*12,200+Math.cos(a)*42,200+Math.sin(a)*42);}
  c.fillStyle='#0a0c10';c.beginPath();c.arc(200,200,8,0,TAU);c.fill();
  c.fillStyle='#c47a3a';c.beginPath();c.arc(200,200,4,0,TAU);c.fill();
  for(const[x,y]of ANOM_NODES.slice(0,4)){                                  // громоотводы
    c.fillStyle='rgba(0,0,0,0.4)';c.fillRect(x-13+3,y-13+4,26,26);
    c.fillStyle='#33373d';c.strokeStyle='#0d0f12';c.lineWidth=1.5;c.fillRect(x-13,y-13,26,26);c.strokeRect(x-13,y-13,26,26);
    c.fillStyle='#5a6068';c.beginPath();c.arc(x,y,7,0,TAU);c.fill();c.stroke();
    c.fillStyle='#c47a3a';c.beginPath();c.arc(x,y,3.5,0,TAU);c.fill();
  }
  anomalyOverlay=off;return off;
}
function drawAnomalyRoom(r,now){
  ctx.save();ctx.globalAlpha=r.alpha;
  ctx.drawImage(getAnomalyOverlay(),r.x0,r.y0);
  ctx.fillStyle=`rgba(110,160,255,${0.05+0.03*Math.sin(now*0.004)})`;ctx.fillRect(r.x0,r.y0,S,S);  // холодная подсветка
  ctx.restore();
}
function drawAnomalyArcs(r,now){                                            // поверх тумана — видно издалека
  const bucket=Math.floor(now/80),rng=mulberry32((bucket*7919+r.rx*131+r.ry*17)|0);
  const n=rng()<0.35?0:1+Math.floor(rng()*2);
  ctx.save();ctx.globalAlpha=Math.min(1,r.alpha+0.25);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';ctx.lineJoin='round';
  for(let k=0;k<n;k++){
    const a=ANOM_NODES[Math.floor(rng()*5)];let b=ANOM_NODES[Math.floor(rng()*5)];if(b===a)b=a===ANOM_NODES[4]?ANOM_NODES[0]:ANOM_NODES[4];
    const dx=-(b[1]-a[1]),dy=b[0]-a[0],L=Math.hypot(dx,dy)||1,pts=[],segs=10;
    for(let i=0;i<=segs;i++){const t=i/segs,j=(i===0||i===segs)?0:(rng()-0.5)*40;pts.push([r.x0+a[0]+(b[0]-a[0])*t+dx/L*j,r.y0+a[1]+(b[1]-a[1])*t+dy/L*j]);}
    for(const[col,w]of[['rgba(100,160,255,0.25)',7],['rgba(170,210,255,0.6)',2.5],['rgba(255,255,255,0.95)',1]]){
      ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();}
    ctx.fillStyle='rgba(200,225,255,0.9)';
    for(const e of[a,b])for(let i=0;i<4;i++){const ang=rng()*TAU,d=4+rng()*14;ctx.fillRect(r.x0+e[0]+Math.cos(ang)*d,r.y0+e[1]+Math.sin(ang)*d,1.5,1.5);}
    ctx.fillStyle='rgba(120,170,255,0.06)';ctx.fillRect(r.x0,r.y0,S,S);   // вспышка
  }
  for(const[x,y]of ANOM_NODES){                                             // постоянное тление на кончиках
    const f=0.6+0.4*Math.sin(now*0.02+x*0.1+y*0.07),X=r.x0+x,Y=r.y0+y;
    const g=ctx.createRadialGradient(X,Y,0,X,Y,10*f);g.addColorStop(0,'rgba(150,200,255,0.5)');g.addColorStop(1,'rgba(150,200,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(X,Y,10*f,0,TAU);ctx.fill();
  }
  ctx.restore();
}

// ---------- G9. ВЫХОД ----------
function exitSide(rx,ry){return rx===0?'W':rx===MAP.w-1?'E':ry===0?'N':ry===MAP.h-1?'S':null;}
function drawExitPortal(r,now){
  const side=exitSide(r.rx,r.ry);if(!side)return;
  const[ax,ay,bx,by]=sideSegment(r.x0,r.y0,side),mx=(ax+bx)/2,my=(ay+by)/2;
  const rot={S:0,W:Math.PI/2,N:Math.PI,E:-Math.PI/2}[side];
  const W=130,H=WALL_T/2,depth=90,[wh,ws,wl]=r.theme.wall;
  ctx.save();ctx.globalAlpha=r.alpha;ctx.translate(mx,my);ctx.rotate(rot);  // локально: +y = наружу
  // дневной свет ложится на пол комнаты
  ctx.save();ctx.globalCompositeOperation='lighter';
  const sp=ctx.createRadialGradient(0,0,10,0,0,240);sp.addColorStop(0,'rgba(200,225,255,0.35)');sp.addColorStop(0.5,'rgba(180,210,255,0.12)');sp.addColorStop(1,'rgba(160,200,255,0)');
  ctx.fillStyle=sp;ctx.beginPath();ctx.arc(0,0,240,0,TAU);ctx.fill();ctx.restore();
  // листья, занесённые внутрь
  ctx.fillStyle='#4f8a33';
  for(let i=0;i<9;i++){const x=Math.sin(i*2.3)*W*0.5,y=-H-8-(i*29)%70;ctx.beginPath();ctx.ellipse(x,y,4,2.3,i*0.9,0,TAU);ctx.fill();}
  // проём: от сумрака у стены к свету снаружи
  const sky=ctx.createLinearGradient(0,-H,0,depth);sky.addColorStop(0,'#1d2b3a');sky.addColorStop(0.45,'#5f86a8');sky.addColorStop(1,'#e2eef8');
  ctx.fillStyle=sky;ctx.fillRect(-W/2,-H-2,W,depth+H+2);
  for(let i=0;i<5;i++){                                                     // ступени вверх
    const y0=H+2+i*14;ctx.fillStyle=`rgba(255,255,255,${0.05+i*0.05})`;ctx.fillRect(-W/2+8,y0,W-16,13);
    ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=1;line(ctx,-W/2+8,y0,W/2-8,y0);
  }
  ctx.strokeStyle='#5f9a3c';ctx.lineWidth=1.5;                               // трава на ступенях
  for(let i=0;i<10;i++){const x=-W/2+14+i*12,y=H+30+((i*37)%40);line(ctx,x,y,x-2,y-6);line(ctx,x,y,x+3,y-5);}
  for(const s of[-1,1]){                                                    // каменные косяки
    const x=s*W/2;
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.fillRect(x-9+3,-H-8+3,18,H*2+16);
    ctx.fillStyle=hsl(wh,ws,wl+10);ctx.fillRect(x-9,-H-8,18,H*2+16);
    ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;ctx.strokeRect(x-9,-H-8,18,H*2+16);
  }
  ctx.strokeStyle='#3f7a2a';ctx.lineWidth=2;                                 // плющ, ползущий от проёма внутрь
  for(const s of[-1,1])for(let i=0;i<3;i++){
    const x=s*(W/2+16+i*22);ctx.beginPath();ctx.moveTo(x,H);ctx.quadraticCurveTo(x+s*6,-H-14-i*8,x-s*4,-H-38-i*12);ctx.stroke();
    ctx.fillStyle='#4f9a35';for(let k=1;k<=3;k++){const t=k/3.5;ctx.beginPath();ctx.ellipse(x+s*3*(1-t),H-(H*2+38+i*12)*t,4,2.5,s*0.7,0,TAU);ctx.fill();}
  }
  ctx.fillStyle='rgba(255,255,255,0.6)';                                    // пылинки в луче
  for(let i=0;i<10;i++){const t=(now*0.00008*(1+i%3)+i*0.37)%1,x=(i-5)*W/12+Math.sin(now*0.001+i)*8;ctx.beginPath();ctx.arc(x,-t*150,1.2,0,TAU);ctx.fill();}
  ctx.restore();
}

// ---------- G10. СЛОИ ----------
function drawEntities(visible,now){
  for(const r of visible){const k=roomKind(r.rx,r.ry);
    if(k==='shop')drawShopRoom(r,now);else if(k==='anomaly')drawAnomalyRoom(r,now);else if(k==='exit')drawExitPortal(r,now);}
  for(const r of visible){const t=PICKUPS.get(r.rx+','+r.ry);if(t)drawPickup(t,r.sx,r.sy,now,r.alpha);}
  for(const d of DROPPED){const r=visible.find(v=>v.rx===d.rx&&v.ry===d.ry);if(r)drawDroppedItem(d,r.sx+d.dx,r.sy+d.dy,now,r.alpha);}
  drawMonstersLayer(visible,now);
}
function drawEntitiesOverlay(visible,now){
  drawMonsterEyesOverlay(visible,now);
  for(const r of visible)if(roomKind(r.rx,r.ry)==='anomaly')drawAnomalyArcs(r,now);
  drawHud(now);drawMiniMap(now);
}

function startTransition(dir){
  if(transition)return;
  const dt=MAP.rooms[player.y][player.x][dir];
  if(dt==='wall'){flashMessage('Там стена');return;}
  if(String(dt).startsWith('locked')){flashMessage('Дверь заперта');return;}
  transition={phase:'opening',dir,doorKey:doorKey(player.x,player.y,dir),swingDir:SWING_BY_DIR[dir],doorAngle:0,progress:0};
}

function updateTransition(dt){
  if(!transition)return;
  transition.progress+=dt;
  if(transition.phase==='opening'){
    const t=Math.min(transition.progress/T_OPEN,1);
    transition.doorAngle=easeInOut(t)*90;
    if(t>=1){transition.phase='moving';transition.progress=0;transition.doorAngle=90;}
  }else if(transition.phase==='moving'){
    const t=Math.min(transition.progress/T_MOVE,1);
    const e=easeInOut(t);
    visual.offsetX=DIR[transition.dir].dx*ROOM_SIZE*e;
    visual.offsetY=DIR[transition.dir].dy*ROOM_SIZE*e;
    if(t>=1){
      player.x+=DIR[transition.dir].dx;player.y+=DIR[transition.dir].dy;
      visual.offsetX=0;visual.offsetY=0;
      transition.phase='closing';transition.progress=0;transition.doorAngle=90;
      posEl.textContent=`${player.x}, ${player.y}`;
    }
  }else if(transition.phase==='closing'){
    const t=Math.min(transition.progress/T_CLOSE,1);
    transition.doorAngle=(1-easeInOut(t))*90;
    if(t>=1)transition=null;
  }
}

canvas.addEventListener('click',(e)=>{
  if(transition)return;
  const rect=canvas.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(canvas.width/rect.width);
  const my=(e.clientY-rect.top)*(canvas.height/rect.height);
  const dx=Math.round((mx-CANVAS_SIZE/2)/ROOM_SIZE);
  const dy=Math.round((my-CANVAS_SIZE/2)/ROOM_SIZE);
  if(Math.abs(dx)+Math.abs(dy)!==1)return;
  const dir=Object.keys(DIR).find(d=>DIR[d].dx===dx&&DIR[d].dy===dy);
  if(dir)startTransition(dir);
});

document.addEventListener('keydown',(e)=>{
  const km={ArrowUp:'N',ArrowDown:'S',ArrowRight:'E',ArrowLeft:'W'};
  const dir=km[e.key]; if(!dir)return; e.preventDefault();
  if(transition)return; startTransition(dir);
});

let messageTimer=null;
function flashMessage(text){
  msgEl.textContent=text;
  clearTimeout(messageTimer);
  messageTimer=setTimeout(()=>{msgEl.textContent='';},1500);
}

let lastTime=performance.now();
function loop(now){
  const dt=Math.min((now-lastTime)/1000,0.1); lastTime=now;
  updateTransition(dt); if(typeof updateMonsters==='function')updateMonsters(dt); render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
